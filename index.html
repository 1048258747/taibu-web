    <script>
      // 首屏渲染前应用主题偏好，避免深色默认下闪白

        var saved = localStorage.getItem("taibu:theme");
        document.documentElement.dataset.theme = saved === "light" ? "light" : "dark";
      } catch (error) {}
    </script>
